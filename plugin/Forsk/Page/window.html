<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Forsk</title>
<style>
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --ink: #1C1917;
  --muted: #78716C;
  --faint: #A8A29E;
  --line: #E7E5E4;
  --bubble: #F2F0ED;
  --field: #F7F6F4;
  --ok: #15803D;
  --bad: #B91C1C;
  --brand: #2948f5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); }
body {
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: 14px;
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}
header { padding: 14px 16px 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo { flex: none; display: block; width: 15px; height: 19px; color: var(--brand); }
.mark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.file { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { color: var(--muted); font-size: 12px; margin-top: 2px; }
.status:empty, .target:empty { display: none; }
#thread { flex: 1; overflow-y: auto; padding: 12px 16px 8px; -webkit-user-select: text; user-select: text; cursor: auto; }
.row { display: flex; margin: 0 0 8px; }
.row.user { justify-content: flex-end; }
.bubble { max-width: 85%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.assistant .bubble { background: var(--bubble); color: var(--ink); }
/* 14% brand over the white page. One variable; the wash is the tint. */
.user .bubble {
  color: var(--ink);
  background-color: var(--brand);
  background-image: linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.86));
}
.line { color: var(--muted); font-size: 12px; margin: 0 0 8px; white-space: pre-wrap; }
.receipt { color: var(--muted); font-size: 12px; margin: 0 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.receipt b { color: var(--ink); font-weight: 600; }
.receipt .tick { color: var(--ok); margin-right: 4px; }
.receipt .cross { color: var(--bad); margin-right: 4px; }
.card { border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; margin: 0 0 8px; animation: rise 160ms ease-out; }
.card .question { margin: 0 0 8px; }
.card.done, .card.stale { border: 0; padding: 0; animation: none; color: var(--muted); font-size: 12px; }
.card.stale { color: var(--faint); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font: inherit; font-size: 13px; line-height: 1;
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ink);
  background: var(--paper); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.pill.primary { background: var(--ink); color: #FFFFFF; }
.pill:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
.step { position: relative; overflow: hidden; color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.dots { display: inline-flex; gap: 4px; padding: 10px 12px; border-radius: 18px; background: var(--bubble); margin: 0 0 8px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: 0.3; animation: blink 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
.card input {
  font: inherit; font-size: 14px; width: 120px; margin: 0 6px 8px 0; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); outline: none;
  -webkit-user-select: text; user-select: text;
}
.card input:focus { border-color: var(--muted); }
.card .unit { color: var(--muted); font-size: 12px; }
.card .field-row { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
.card .field-row input { margin: 0; flex: 1; min-width: 0; width: auto; }
.card .field-label { flex: none; width: 84px; color: var(--muted); font-size: 12px; }
.card .note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.card .rows { margin: 0 0 8px; padding: 0; list-style: none; color: var(--ink); font-size: 13px; }
.card .rows li { padding: 2px 0; }
nav.bar { padding: 8px 12px 0; border-top: 1px solid var(--line); }
.slots { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
.slot { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.slot.primary { flex: none; }
.help-button {
  flex: none; margin-left: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 600 13px/28px -apple-system, sans-serif; cursor: pointer;
}
.help-button.open { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.reason { color: var(--muted); font-size: 12px; margin: 5px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reason b { font-weight: 600; color: var(--ink); }
@media (max-width: 359px) { .slots .slot:nth-child(3) { display: none; } }
.sheet {
  position: absolute; left: 12px; right: 12px; bottom: 100%; margin-bottom: 8px; max-height: 60vh; overflow-y: auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; animation: rise 160ms ease-out;
  -webkit-user-select: text; user-select: text;
}
.sheet h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
.sheet h3 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.sheet .pills { margin: 0 0 2px; }
.sheet .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.dock { position: relative; }
select.role-pick {
  flex: none; align-self: center; -webkit-appearance: none; appearance: none;
  height: 28px; box-sizing: border-box;
  font: 12px/26px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; margin: 0; cursor: pointer;
}
select.role-pick:empty { display: none; }
select.role-pick.set { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
select.role-pick:focus-visible { outline: 2px solid var(--muted); outline-offset: 1px; }
.marked > .role { display: block; color: var(--muted); font-size: 11px; margin: 0 0 2px 12px; }
.add {
  flex: none; align-self: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted);
  font: 400 22px/32px -apple-system, sans-serif; cursor: pointer; padding: 0; margin: 0;
  -webkit-appearance: none; appearance: none;
  /* The system "+" ink sits 2px below the em centre, so the control reads low. */
  transform: translateY(-2px);
}
.step::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.85) 50%, rgba(255,255,255,0) 100%);
  transform: translateX(-100%); animation: sheen 1.6s linear infinite;
}
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
form.composer { margin: 0; padding: 8px 12px 12px; }
.field {
  display: flex; align-items: center; gap: 8px;
  background: var(--field); border: 1px solid var(--line); border-radius: 22px;
  padding: 4px; min-height: 40px;
}
textarea {
  flex: 1; align-self: center; min-width: 0; height: 32px; border: 0; outline: none; resize: none; background: transparent;
  font: inherit; font-size: 14px; line-height: 32px; color: var(--ink); caret-color: var(--ink);
  padding: 0; margin: 0; max-height: calc(32px * 5); overflow-y: auto;
  -webkit-user-select: text; user-select: text;
}
textarea::placeholder { color: var(--faint); }
.send {
  flex: none; align-self: center; width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: var(--brand); color: #FFFFFF; font: 600 16px/32px -apple-system, sans-serif; cursor: pointer; padding: 0; margin: 0;
  -webkit-appearance: none; appearance: none;
}
.send:disabled {
  background-color: var(--brand);
  background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82));
  color: var(--ink); cursor: default;
}
@media (prefers-reduced-motion: reduce) {
  .step::after { animation: none; display: none; }
  .card, .sheet { animation: none; }
  .dots span { animation: none; opacity: 0.6; }
}
</style>
</head>
