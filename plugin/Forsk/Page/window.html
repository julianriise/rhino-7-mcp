<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Forsk</title>
<style>
:root {
  color-scheme: light;
  --page: #F5F6F8;
  --card: #FFFFFF;
  --ink: #1A1A1A;
  --meta: #8A8F98;
  --faint: #B0B4BC;
  --line: rgba(26, 26, 26, 0.08);
  --ok: #15803D;
  --bad: #B91C1C;
  --brand: #2948f5;
  --shadow: 0 1px 2px rgba(26, 26, 26, 0.05), 0 8px 24px rgba(26, 26, 26, 0.06);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--page); }
body {
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}
a { color: var(--brand); }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
header.top {
  position: relative;
  display: grid;
  grid-template-columns: 34px 1fr 34px;
  align-items: start;
  column-gap: 8px;
  padding: 16px 14px 8px;
}
.round {
  width: 34px; height: 34px; margin-top: 5px; border: 0; border-radius: 50%;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center; padding: 0; cursor: pointer;
}
#more { justify-self: end; }
.gear { position: relative; width: 16px; height: 16px; display: block; }
.gear svg { display: block; }
.notice {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--bad);
  box-shadow: 0 0 0 2px #fff;
}
.gear .notice { position: absolute; top: -3px; right: -3px; }
.menu .notice { margin-left: auto; }
.identity { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.avatar { width: 44px; height: 44px; display: block; }
.avatar svg { width: 100%; height: 100%; display: block; }
.role-pill {
  display: flex; flex-direction: column; align-items: center; max-width: 100%;
  border: 0; background: var(--card); color: var(--ink); border-radius: 16px;
  padding: 6px 14px 7px; box-shadow: var(--shadow); cursor: pointer; font: inherit;
}
.role-pill.set { box-shadow: 0 0 0 1px rgba(41, 72, 245, 0.35), 0 1px 2px rgba(26, 26, 26, 0.05); }
.role-line { display: flex; align-items: center; gap: 3px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; line-height: 1.2; }
.chev { color: var(--meta); display: block; }
.role-sub {
  color: var(--meta); font-size: 12px; font-weight: 400; line-height: 1.25;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status { grid-column: 1 / -1; text-align: center; color: var(--meta); font-size: 12px; margin: 6px 0 0; }
.status:empty { display: none; }
.menu {
  position: absolute; z-index: 5; min-width: 196px; margin-top: 6px; padding: 6px;
  background: var(--card); border-radius: 14px; box-shadow: 0 8px 28px rgba(26, 26, 26, 0.12), 0 0 0 1px rgba(26, 26, 26, 0.05);
}
#role-menu { top: 100%; left: 50%; transform: translateX(-50%); }
#more-menu { top: 46px; right: 14px; }
.menu button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px;
  line-height: 1.2; border-radius: 10px; padding: 8px 10px; cursor: pointer;
}
.menu button.split { margin-top: 6px; }
.menu button:hover, .menu button:focus { background: var(--page); }
.menu button[aria-checked="true"] { font-weight: 600; }
.mini { width: 20px; height: 20px; flex: none; display: block; }
#thread {
  flex: 1; overflow-y: auto; padding: 8px 20px 12px;
  -webkit-user-select: text; user-select: text; cursor: auto;
}
.row { display: flex; margin: 14px 0; }
.row.user { justify-content: flex-end; }
.bubble { max-width: 82%; padding: 10px 14px; border-radius: 15px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; }
/* 14% brand over the page. One variable; the wash is the tint. */
.user .bubble {
  color: var(--ink);
  background-color: var(--brand);
  background-image: linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.86));
}
.answer { font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.answer b { font-weight: 600; }
.marked { margin: 16px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.meta { display: flex; align-items: center; gap: 6px; color: var(--meta); font-size: 12px; margin: 0 0 8px; }
.meta .mini { width: 16px; height: 16px; }
.line { color: var(--meta); font-size: 13px; margin: 0 0 10px; white-space: pre-wrap; }
.receipt { color: var(--meta); font-size: 13px; margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.receipt b { color: var(--ink); font-weight: 600; }
.receipt .tick { color: var(--ok); margin-right: 4px; }
.receipt .cross { color: var(--bad); margin-right: 4px; }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; margin: 0 0 10px; animation: rise 160ms ease-out; }
.card .question { margin: 0 0 8px; }
.card.done, .card.stale { background: transparent; box-shadow: none; padding: 0; animation: none; color: var(--meta); font-size: 13px; }
.card.stale { color: var(--faint); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font: inherit; font-size: 13px; font-weight: 500; line-height: 1;
  padding: 8px 14px; border-radius: 999px; border: 0;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow); cursor: pointer; white-space: nowrap;
}
.pill.primary { background: var(--brand); color: #FFFFFF; box-shadow: none; font-weight: 600; }
.step { position: relative; overflow: hidden; color: var(--meta); font-size: 13px; margin: 0 0 8px; }
.dots { display: inline-flex; gap: 4px; padding: 4px 0 8px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--meta); opacity: 0.35; animation: blink 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.35; } 40% { opacity: 1; } }
.card input {
  font: inherit; font-size: 15px; width: 120px; margin: 0 6px 8px 0; padding: 6px 10px;
  border: 0; border-radius: 10px; background: var(--page); color: var(--ink); outline: none;
  box-shadow: inset 0 0 0 1px var(--line);
  -webkit-user-select: text; user-select: text;
}
.card input:focus { box-shadow: inset 0 0 0 1px var(--meta); }
.card .unit { color: var(--meta); font-size: 12px; }
.card .field-row { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
.card .field-row input { margin: 0; flex: 1; min-width: 0; width: auto; }
.card .field-label { flex: none; width: 84px; color: var(--meta); font-size: 12px; }
.card .note { color: var(--meta); font-size: 12px; margin: 6px 0 0; }
.card .rows { margin: 0 0 8px; padding: 0; list-style: none; color: var(--ink); font-size: 14px; }
.card .rows li { padding: 2px 0; }
nav.bar { padding: 4px 16px 0; }
.slots { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
.slot { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.slot.primary { flex: none; }
.help-button {
  flex: none; margin-left: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  font: 600 13px/30px -apple-system, system-ui, sans-serif; cursor: pointer;
}
.help-button.open { background: var(--brand); color: #FFFFFF; box-shadow: none; }
.reason { color: var(--meta); font-size: 12px; margin: 6px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reason b { font-weight: 600; color: var(--ink); }
@media (max-width: 359px) { .slots .slot:nth-child(3) { display: none; } }
.sheet {
  position: absolute; left: 12px; right: 12px; bottom: 100%; margin-bottom: 8px; max-height: 60vh; overflow-y: auto;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; animation: rise 160ms ease-out;
  -webkit-user-select: text; user-select: text;
}
.sheet h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
.sheet h3 { font-size: 11px; font-weight: 600; color: var(--meta); margin: 10px 0 4px; }
.sheet .pills { margin: 0 0 2px; }
.sheet .hint { color: var(--meta); font-size: 12px; margin: 8px 0 0; }
.dock { position: relative; }
.add {
  flex: none; align-self: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--meta);
  font: 400 22px/32px -apple-system, system-ui, sans-serif; cursor: pointer; padding: 0; margin: 0;
  -webkit-appearance: none; appearance: none;
  /* The system "+" ink sits 2px below the em centre, so the control reads low. */
  transform: translateY(-2px);
}
.key-hint { flex: none; align-self: center; color: var(--meta); font-size: 12px; line-height: 1; padding: 0 2px 0 0; }
.step::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
  background: linear-gradient(90deg, rgba(245,246,248,0) 0%, rgba(245,246,248,0.9) 50%, rgba(245,246,248,0) 100%);
  transform: translateX(-100%); animation: sheen 1.6s linear infinite;
}
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
form.composer { margin: 0; padding: 8px 16px 16px; }
.field {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 0; border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 6px 6px 6px 4px; min-height: 48px;
}
textarea {
  flex: 1; align-self: center; min-width: 0; height: 32px; border: 0; outline: none; resize: none; background: transparent;
  font: inherit; font-size: 15px; line-height: 32px; color: var(--ink); caret-color: var(--ink);
  padding: 0; margin: 0; max-height: calc(32px * 5); overflow-y: auto;
  -webkit-user-select: text; user-select: text;
}
textarea::placeholder { color: var(--faint); }
.send {
  flex: none; align-self: center; width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: var(--brand); color: #FFFFFF; font: 600 16px/32px -apple-system, system-ui, sans-serif; cursor: pointer; padding: 0; margin: 0;
  -webkit-appearance: none; appearance: none;
}
.send:disabled {
  background-color: var(--brand);
  background-image: linear-gradient(rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.82));
  color: var(--ink); cursor: default;
}
@media (prefers-reduced-motion: reduce) {
  .step::after { animation: none; display: none; }
  .card, .sheet { animation: none; }
  .dots span { animation: none; opacity: 0.6; }
}
</style>
</head>
<body>
<header class="top">
  <button id="history" class="round" type="button" aria-label="History" title="History">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M4.2 4.2v4.2h4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8.2V12l2.4 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="identity">
    <div id="avatar" class="avatar" aria-hidden="true"></div>
    <button id="role-pill" class="role-pill" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="role-menu">
      <span class="role-line"><span id="role-name">Planner</span><svg class="chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M4.5 2.5 L8 6 L4.5 9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span id="file" class="role-sub"></span>
    </button>
    <div id="role-menu" class="menu" role="menu" hidden></div>
  </div>
  <button id="more" class="round" type="button" aria-label="Settings" title="Settings" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
    <span class="gear">
      <svg viewBox="0 0 24 24" width="16" height="16" overflow="visible" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="gear-dot" class="notice" hidden aria-hidden="true"></span>
    </span>
  </button>
  <div id="more-menu" class="menu" role="menu" hidden><div id="settings"></div></div>
  <div id="status" class="status"></div>
  <div id="target" hidden></div>
  <div id="avatars" hidden>
    <div id="avatar-planner">%%AVATAR_PLANNER%%</div>
    <div id="avatar-modeller">%%AVATAR_MODELLER%%</div>
    <div id="avatar-plotter">%%AVATAR_PLOTTER%%</div>
    <div id="avatar-analyser">%%AVATAR_ANALYSER%%</div>
    <div id="avatar-render">%%AVATAR_RENDER%%</div>
  </div>
</header>
<main id="thread" aria-live="polite"></main>
<div class="dock">
  <div id="sheet"></div>
  <nav id="bar" class="bar" aria-label="Suggestions"></nav>
  <form id="composer" class="composer" autocomplete="off">
    <div class="field">
      <button id="add" class="add" type="button" aria-label="Import a plan" title="Import a plan">+</button>
      <textarea id="q" rows="1" placeholder="Ask Forsk…" spellcheck="true" aria-label="Ask Forsk"></textarea>
      <span class="key-hint" aria-hidden="true" title="Return to send">&#x23CE;</span>
      <button id="send" class="send" type="submit" aria-label="Send" disabled>&#8593;</button>
    </div>
  </form>
</div>
<script>
window.FORSK_TOKEN = "%%FORSK_TOKEN%%";
window.FORSK_ORIGIN = "%%FORSK_ORIGIN%%";
</script>
<script>
FORSK_SCRIPT
</script>
</body>
</html>
