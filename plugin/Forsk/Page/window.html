<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>Forsk</title>
<style>
:root {
  color-scheme: light;
  --page: #F5F6F8;
  --card: #FFFFFF;
  --ink: #1A1A1A;
  --meta: #66707A;
  --faint: #8A8F98;
  --line: rgba(26, 26, 26, 0.08);
  --ok: #15803D;
  --bad: #B91C1C;
  --brand: #2948f5;
  --shadow: 0 1px 2px rgba(26, 26, 26, 0.05), 0 8px 24px rgba(26, 26, 26, 0.06);
  --lift: 0 1px 2px rgba(26, 26, 26, 0.05);
  --on-brand: #FFFFFF;
  --paper: #FFFFFF;
  --focus: rgba(41, 72, 245, 0.55);
  --brand-ring: rgba(41, 72, 245, 0.35);
  /* The crew's colours (the avatars' gradients), for the What's new card. */
  --crew-planner: #3b93f0;
  --crew-modeller: #3ecf8e;
  --crew-analyser: #8b5cf6;
  --crew-render: #f0b429;
  --news-wash-a: rgba(59, 147, 240, 0.10);
  --news-wash-b: rgba(139, 92, 246, 0.10);
  --news-wash-c: rgba(240, 180, 41, 0.10);
  --news-ring: rgba(139, 92, 246, 0.22);
  --news-rule: rgba(139, 92, 246, 0.16);
  --menu-shadow: 0 8px 28px rgba(26, 26, 26, 0.12), 0 0 0 1px rgba(26, 26, 26, 0.05);
  --thumb: rgba(102, 112, 122, 0.45);
  --thumb-hover: rgba(102, 112, 122, 0.75);
  --wash: rgba(255, 255, 255, 0.86);
  --sheen-edge: rgba(245,246,248,0);
  --sheen-mid: rgba(245,246,248,0.9);
}
/* Dark (DM.2): every token again. Nothing sets data-theme yet, so dark stays unreachable until DM.3. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #16181C;
  --card: #23262B;
  --ink: #ECEDEF;
  --meta: #A3A9B1;
  --faint: #8E949C;
  --line: rgba(236, 237, 239, 0.12);
  --ok: #4ADE80;
  --bad: #F87171;
  --brand: #7088FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  --lift: 0 1px 2px rgba(0, 0, 0, 0.4);
  --on-brand: #0B0F2E;
  --paper: #FFFFFF;
  --focus: rgba(112, 136, 255, 0.7);
  --brand-ring: rgba(112, 136, 255, 0.45);
  --crew-planner: #62a9f3;
  --crew-modeller: #65d9a5;
  --crew-analyser: #a27df8;
  --crew-render: #f3c354;
  --news-wash-a: rgba(98, 169, 243, 0.16);
  --news-wash-b: rgba(162, 125, 248, 0.16);
  --news-wash-c: rgba(243, 195, 84, 0.12);
  --news-ring: rgba(162, 125, 248, 0.35);
  --news-rule: rgba(162, 125, 248, 0.22);
  --menu-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(236, 237, 239, 0.1);
  --thumb: rgba(163, 169, 177, 0.45);
  --thumb-hover: rgba(163, 169, 177, 0.75);
  --wash: rgba(35, 38, 43, 0.8);
  --sheen-edge: rgba(22,24,28,0);
  --sheen-mid: rgba(22,24,28,0.9);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page); }
body {
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
  /* A path or a layer name has no spaces. Wrap only when the line does not fit. */
  overflow-wrap: anywhere;
}
a { color: var(--brand); }
button {
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
}
/* A click focuses without a ring. Tab sets data-kbd, because older WKWebView paints :focus-visible for a click. The field keeps the caret only. */
button:focus, textarea:focus, input:focus, select:focus { outline: none; }
html[data-kbd] button:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 2px; }
header.top {
  position: relative;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  align-items: start;
  column-gap: 8px;
  padding: 16px 14px 8px;
}
.round {
  width: 34px; height: 34px; margin-top: 5px; border: 0; border-radius: 50%;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center; padding: 0; cursor: pointer;
}
#more { justify-self: end; }
.gear { position: relative; width: 16px; height: 16px; display: block; }
.gear svg { display: block; }
.notice {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--bad);
  box-shadow: 0 0 0 2px var(--card);
}
.gear .notice { position: absolute; top: -3px; right: -3px; }
.menu .notice { margin-left: auto; }
.identity { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.avatar { width: 44px; height: 44px; display: block; }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar.tap { cursor: pointer; border-radius: 50%; }
.role-pill {
  display: flex; flex-direction: column; align-items: center; max-width: 100%;
  border: 0; background: var(--card); color: var(--ink); border-radius: 16px;
  padding: 6px 14px 7px; box-shadow: var(--shadow); cursor: pointer; font: inherit;
}
.role-pill.set { box-shadow: 0 0 0 1px var(--brand-ring), var(--lift); }
.role-line { display: flex; align-items: center; gap: 3px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; line-height: 1.2; }
.chev { color: var(--meta); display: block; }
.role-sub {
  color: var(--meta); font-size: 12px; font-weight: 400; line-height: 1.25;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status { grid-column: 1 / -1; text-align: center; color: var(--meta); font-size: 12px; margin: 6px 0 0; }
.status:empty { display: none; }
.menu {
  position: absolute; z-index: 5; min-width: 196px; margin-top: 6px; padding: 6px;
  background: var(--card); border-radius: 14px; box-shadow: var(--menu-shadow);
}
#role-menu { top: 100%; left: 50%; transform: translateX(-50%); }
#more-menu { top: 46px; right: 14px; }
.menu button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px;
  line-height: 1.2; border-radius: 10px; padding: 8px 10px; cursor: pointer;
}
.menu button.split { margin-top: 6px; }
html[data-kbd] .menu button:focus-visible { background: var(--page); }
.menu button[aria-checked="true"] { font-weight: 600; }
.mini { width: 20px; height: 20px; flex: none; display: block; }
#pin {
  flex: 0 1 auto; min-height: 0; max-height: calc(100% - 248px);
  overflow-x: hidden; overflow-y: auto; padding: 0 20px;
  background: var(--page); position: relative; z-index: 1;
  -webkit-overflow-scrolling: touch;
}
#pin .card { margin-bottom: 8px; }
/* The frame holds the list. The indicator is absolute, so it never reserves a gutter. */
#thread-frame {
  flex: 1; min-height: 64px; min-width: 0; position: relative;
  display: flex; flex-direction: column;
}
#thread {
  flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; padding: 8px 20px 12px;
  -webkit-user-select: text; user-select: text; cursor: auto;
  scrollbar-width: none;
}
#thread::-webkit-scrollbar, #sheet-body::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
#thread-bar, #sheet-bar {
  position: absolute; top: 2px; right: 2px; bottom: 2px; width: 14px; z-index: 2;
  pointer-events: none;
}
#thread-thumb, #sheet-thumb {
  position: absolute; top: 0; right: 0; width: 14px; opacity: 0; pointer-events: none;
  transition: opacity 180ms ease;
  -webkit-user-select: none; user-select: none;
}
#thread-thumb::before, #sheet-thumb::before {
  content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 6px;
  border-radius: 3px; background: var(--thumb);
}
#thread-frame.thumb-on #thread-thumb, #sheet.thumb-on #sheet-thumb { opacity: 1; pointer-events: auto; }
#thread-thumb.drag::before, #sheet-thumb.drag::before,
#thread-frame.thumb-on #thread-thumb:hover::before,
#sheet.thumb-on #sheet-thumb:hover::before { background: var(--thumb-hover); }
.row { display: flex; margin: 14px 0; min-width: 0; }
.row.user { justify-content: flex-end; }
.bubble { max-width: 82%; min-width: 0; padding: 10px 14px; border-radius: 15px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; }
/* 14% brand over the page. One variable; the wash is the tint. */
.user .bubble {
  color: var(--ink);
  background-color: var(--brand);
  background-image: linear-gradient(var(--wash), var(--wash));
  font-size: 13.5px;
  line-height: 1.3;
  padding: 8px 12px;
}
.answer { font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.answer b { font-weight: 600; }
.answer ul, .answer ol { white-space: normal; margin: 0.35em 0; padding: 0 0 0 1.2em; }
.answer ul { list-style: disc; }
.answer ol { list-style: decimal; }
.answer li { margin: 0.12em 0; color: var(--meta); }
.answer li::marker { color: var(--meta); }
.answer li > span { color: var(--ink); }
.answer li ul, .answer li ol { margin: 0.1em 0; }
.marked { margin: 16px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.meta { display: flex; align-items: center; gap: 6px; color: var(--meta); font-size: 12px; margin: 0 0 8px; }
.meta .mini { width: 16px; height: 16px; }
.line { color: var(--meta); font-size: 13px; margin: 0 0 10px; white-space: pre-wrap; }
.guide { color: var(--meta); font-size: 13px; margin: 0 0 12px; }
.guide p { margin: 0; line-height: 1.45; }
.guide-x { font: inherit; font-size: 12px; color: var(--meta); background: transparent; border: 0; padding: 4px 0 0; cursor: pointer; }
.receipt { color: var(--meta); font-size: 13px; margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.receipt b { color: var(--ink); font-weight: 600; }
.receipt .tick { color: var(--ok); margin-right: 4px; }
.receipt .cross { color: var(--bad); margin-right: 4px; }
.receipt .tick svg, .receipt .cross svg { width: 14px; height: 14px; vertical-align: -2px; }
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; margin: 0 0 10px; animation: rise 160ms ease-out; }
.card .question { margin: 0 0 8px; }
.card.done, .card.stale { background: transparent; box-shadow: none; padding: 0; animation: none; color: var(--meta); font-size: 13px; }
.card.stale { color: var(--faint); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font: inherit; font-size: 13px; font-weight: 500; line-height: 1.25;
  padding: 8px 14px; border-radius: 999px; border: 0;
  background: var(--card); color: var(--ink); box-shadow: var(--shadow); cursor: pointer;
  max-width: 100%; overflow-wrap: anywhere;
}
.pill.primary { background: var(--brand); color: var(--on-brand); box-shadow: none; font-weight: 600; }
.guide .pill { margin: 6px 10px 0 0; }
.pill .icon { width: 18px; height: 18px; margin: -4px 6px -4px -4px; vertical-align: middle; }
.step { position: relative; overflow: hidden; color: var(--meta); font-size: 13px; margin: 0 0 8px; }
.dots { display: inline-flex; gap: 4px; padding: 4px 0 8px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--meta); opacity: 0.35; animation: blink 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.35; } 40% { opacity: 1; } }
.card input {
  font: inherit; font-size: 15px; width: 120px; margin: 0 6px 8px 0; padding: 6px 10px;
  border: 0; border-radius: 10px; background: var(--page); color: var(--ink); outline: none;
  box-shadow: inset 0 0 0 1px var(--line);
  -webkit-user-select: text; user-select: text;
}
.card input:focus { box-shadow: inset 0 0 0 1px var(--meta); }
.card input::placeholder, .card textarea::placeholder { color: var(--faint); }
.card .unit { color: var(--meta); font-size: 12px; }
.card .field-row { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
.card .field-row input { margin: 0; flex: 1; min-width: 0; width: auto; }
.card .field-label { flex: none; width: 118px; min-width: 0; color: var(--meta); font-size: 12px; overflow-wrap: anywhere; }
.card .field-row.check .field-label { width: auto; }
.card .field-row.check input { flex: none; width: 16px; height: 16px; padding: 0; box-shadow: none; background: transparent; }
/* Choose sheets: ↑ ↓ move a row; the label takes the room between the tick and the arrows. */
.card .field-row.check .field-label + .move { margin-left: auto; }
.card .move {
  padding: 4px 6px; border: 0; border-radius: 8px;
  background: transparent; color: var(--meta); cursor: pointer;
}
.card .move svg { display: block; width: 14px; height: 14px; }
html[data-kbd] .card .move:focus-visible { background: var(--page); color: var(--ink); }
@media (hover: hover) and (pointer: fine) {
  .menu button:hover { background: var(--page); }
  .card .move:hover { background: var(--page); color: var(--ink); }
}
.card select, .card textarea {
  font: inherit; font-size: 15px; margin: 0; flex: 1; min-width: 0; width: auto; padding: 6px 10px;
  border: 0; border-radius: 10px; background: var(--page); color: var(--ink); outline: none;
  box-shadow: inset 0 0 0 1px var(--line);
  -webkit-user-select: text; user-select: text;
}
.card select:focus, .card textarea:focus { box-shadow: inset 0 0 0 1px var(--meta); }
.card textarea { height: auto; min-height: calc(15px * 1.4 * 4); max-height: calc(15px * 1.4 * 8); resize: vertical; line-height: 1.4; }
.card .field-row.long { align-items: flex-start; }
.card .field-row.long .field-label { padding-top: 8px; }
.card .note { color: var(--meta); font-size: 12px; margin: 6px 0 0; }
.card .logo-preview { display: block; max-width: 180px; max-height: 64px; margin: 8px 0; padding: 6px; background: var(--paper); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
.card .rows { margin: 0 0 8px; padding: 0; list-style: none; color: var(--ink); font-size: 14px; }
.card .rows li { padding: 2px 0; }
/* What's new: a title per item, and where to click under it. */
.menu .build { color: var(--meta); font-size: 11px; padding: 8px 12px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
.card .features { margin: 0 0 8px; padding: 0; list-style: none; }
.card .features li { padding: 6px 0; }
.card .features li + li { border-top: 1px solid var(--line); }
/* What's new: the Support crew's card, in the crew's colours. Each item has its own tinted Lucide icon. */
.card.news {
  position: relative; overflow: hidden; padding: 14px 14px 12px;
  background: linear-gradient(135deg, var(--news-wash-a) 0%, var(--news-wash-b) 55%, var(--news-wash-c) 100%), var(--card);
  box-shadow: 0 0 0 1px var(--news-ring), var(--shadow);
}
.card.news::before {
  content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--crew-planner), var(--crew-modeller), var(--crew-analyser), var(--crew-render));
}
.card.news .news-head { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; }
.card.news .news-face { width: 34px; height: 34px; flex: none; }
.card.news .news-face svg { width: 100%; height: 100%; display: block; }
.card.news .question { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.card.news .news-spark { width: 16px; height: 16px; color: var(--crew-analyser); flex: none; margin-left: auto; }
.card.news .features li { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
.card.news .features li + li { border-top: 1px solid var(--news-rule); }
.card.news .feature-icon { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--on-brand); }
.card.news .feature-icon svg { width: 16px; height: 16px; display: block; }
.card.news .tint-0 { background: var(--crew-planner); }
.card.news .tint-1 { background: var(--crew-analyser); }
.card.news .tint-2 { background: var(--crew-modeller); }
.card.news .tint-3 { background: var(--crew-render); }
.card.news .feature-title { font-weight: 600; }
.card.news .feature-how { color: var(--meta); font-size: 13px; line-height: 1.4; margin-top: 1px; }
.card .feature-title { color: var(--ink); font-size: 14px; font-weight: 600; }
.card .feature-how { color: var(--meta); font-size: 13px; margin-top: 2px; }
nav.bar { padding: 4px 16px 0; }
/* A chip keeps its label. What does not fit moves into the ⋯ menu. */
.slots-wrap { position: relative; }
.slots { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
.slots:focus-within { overflow: visible; }
.slot { flex: none; max-width: none; white-space: nowrap; }
.slot.wrap {
  white-space: normal; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.help-button {
  flex: none; margin-left: auto; width: 30px; height: 30px; padding: 0; border-radius: 50%;
  border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
  display: grid; place-items: center; cursor: pointer;
}
.help-button svg { display: block; width: 16px; height: 16px; }
.help-button.open { background: var(--brand); color: var(--on-brand); box-shadow: none; }
.reason {
  color: var(--meta); font-size: 12px; line-height: 1.35; margin: 6px 2px 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  overflow-wrap: anywhere;
}
.reason b { font-weight: 600; color: var(--ink); }
#slot-menu { top: auto; right: 0; left: auto; bottom: calc(100% + 6px); transform: none; margin-top: 0; z-index: 6; }
.sheet {
  position: absolute; left: 12px; right: 12px; bottom: 100%; margin-bottom: 8px; overflow: hidden;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow); animation: rise 160ms ease-out;
  -webkit-user-select: text; user-select: text;
}
/* The sheet scrolls like the message list: no native bar, the same overlay thumb. */
#sheet-body {
  max-height: 60vh; overflow-x: hidden; overflow-y: auto; padding: 12px 14px;
  scrollbar-width: none;
}
.sheet h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
.sheet h3 { font-size: 11px; font-weight: 600; color: var(--meta); margin: 10px 0 4px; }
.sheet .pills { margin: 0 0 2px; }
.sheet .hint { color: var(--meta); font-size: 12px; margin: 8px 0 0; }
.dock { position: relative; }
.tools { display: flex; align-items: center; gap: 4px; min-height: 32px; }
.add {
  flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--meta);
  display: grid; place-items: center; cursor: pointer; padding: 0; margin: 0;
  -webkit-appearance: none; appearance: none;
}
.key-hint { flex: none; margin-left: auto; color: var(--meta); display: block; padding: 0 2px 0 0; }
.add svg, .key-hint svg, .send svg { display: block; }
.step::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
  background: linear-gradient(90deg, var(--sheen-edge) 0%, var(--sheen-mid) 50%, var(--sheen-edge) 100%);
  transform: translateX(-100%); animation: sheen 1.6s linear infinite;
}
@keyframes sheen { to { transform: translateX(100%); } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
form.composer { margin: 0; padding: 8px 16px 16px; }
.field {
  display: flex; flex-direction: column; align-items: stretch; gap: 2px;
  background: var(--card); border: 0; border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 10px 8px 6px;
}
textarea {
  flex: 1; align-self: center; min-width: 0; border: 0; outline: none; resize: none; background: transparent;
  font: inherit; font-size: 14px; line-height: 1.4; color: var(--ink); caret-color: var(--ink);
  height: calc(14px * 1.4); padding: 0; margin: 0; max-height: calc(14px * 1.4 * 5); overflow-y: auto;
  -webkit-user-select: text; user-select: text;
}
/* The line is the full width of the card. The icons stay on the row under it, so a new line grows upward. */
#q { width: 100%; flex: none; align-self: stretch; padding: 0 8px; }
textarea::placeholder { color: var(--faint); }
.send {
  flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%;
  background: var(--brand); color: var(--on-brand); display: grid; place-items: center; cursor: pointer; padding: 0; margin: 0;
  -webkit-appearance: none; appearance: none;
}
.send:disabled {
  background: var(--brand);
  color: var(--on-brand);
  opacity: 0.85;
  cursor: default;
}
@media (prefers-reduced-motion: reduce) {
  .step::after { animation: none; display: none; }
  .card, .sheet { animation: none; }
  .dots span { animation: none; opacity: 0.6; }
  #thread-thumb { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <!-- v4: the floor picker goes in this spot (ROADMAP v4, multiple storeys). Empty until then, so the role stays centred. -->
  <span class="top-left" aria-hidden="true"></span>
  <div class="identity">
