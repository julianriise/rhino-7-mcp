name: forsk
version: 3.0.0
authors:
  - Julian Riise
description: >
  Forsk turns a floor plan into a 3D model and a full drawing set in Rhino 7
  for Mac, from one chat window. Generate walls, doors, windows and rooms
  from 2D curves, a DXF or a PDF (AI detection), then print a numbered set
  on A4 to A1 with plans, facades, sections, areas and schedules to PDF and
  DWG/DXF. Chat uses your own xAI Grok key, pasted once in Settings.
url: 'https://forsk.app'
keywords:
  - architecture
  - floorplan
  - drawings
  - documentation
  - residential
  - bim
  - ai
icon: icon.png
