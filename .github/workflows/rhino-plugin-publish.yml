name: Build and Publish Rhino Plugin

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    env:
      SOLUTION_PATH: ${{ github.workspace }}/plugin/rhinomcp.sln
      PROJECT_PATH: ${{ github.workspace }}/plugin/rhinomcp.csproj
      ARTIFACT_NAME: rhinomcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution with MSBuild
        run: |
          dotnet msbuild ${{ env.SOLUTION_PATH }} /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare artifacts
        run: |
          mkdir -p dist/net48
          cp ${{ github.workspace }}/plugin/bin/Release/net48/*.dll dist/net48/
          cp ${{ github.workspace }}/plugin/bin/Release/net48/*.rhp dist/net48/
          cp ${{ github.workspace }}/plugin/manifest.yml dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/

  publish:
    name: Upload plugin zip to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      contents: write
    env:
      ARTIFACT_NAME: rhinomcp

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Zip plugin and upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This R7 fork does not push to Yak. The Package Manager rhinomcp
          # package is the Rhino 8 line.
          cd dist
          zip -r rhinomcp-r7-net48.zip net48 manifest.yml
          gh release upload "${{ github.event.release.tag_name }}" rhinomcp-r7-net48.zip --clobber
